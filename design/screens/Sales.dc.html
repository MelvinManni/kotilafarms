<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sales — Kotila Farms</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kotila/components/bundle.css">
<script src="ds/kotila/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2ea;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#10180b}
a{color:#2f6410}a:hover{color:#1f470a}
</style>
</helmet>
<div class="k-root" style="position: relative; width: 1440px; height: 1100px; display: flex; background: #eef2ea; overflow: hidden">
  <x-import component-from-global-scope="Kotila.SideRail" active="sales" logo-src="/_blob/5f856855f9b37e32751e00e7d2b65ce0" user="{{user}}" sync="{{sync}}" badges="{{badges}}" style="height: 1100px"></x-import>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; color: #4e5948">Set 3 closed 14 Sep · 465 birds sold for ₦3,547,650</span>
        <h1 style="margin: 0; font-family: Signika, sans-serif; font-weight: 600; font-size: 38px; line-height: 42px; letter-spacing: -0.02em">Sales</h1>
      </div>
      <div style="display: flex; gap: 12px">
        <x-import component-from-global-scope="Kotila.Button" icon="naira">Record a payment</x-import>
        <x-import component-from-global-scope="Kotila.Button" variant="primary" icon="plus">New sale</x-import>
      </div>
    </header>

    <x-import component-from-global-scope="Kotila.Notice" tone="owed" title="₦412,000 is owed by 3 buyers" action="{{noticeAction}}">Oldest: Mama Nkechi, ₦215,000 for 30 birds from Set 3 — 19 days unpaid</x-import>

    <x-import component-from-global-scope="Kotila.Panel" title="Outstanding balances" subtitle="Oldest first. A balance is cleared only when the payment is recorded." flush="{{yes}}" action="{{buyersAction}}">
      <x-import component-from-global-scope="Kotila.LedgerTable" caption="Buyers who still owe money" dense="{{yes}}" columns="{{owedColumns}}" rows="{{owedRows}}" footer="{{owedFooter}}"></x-import>
    </x-import>

    <section style="background: #ffffff; border: 1px solid #e1e8da; border-radius: 24px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 8px 24px 0">
        <x-import component-from-global-scope="Kotila.Tabs" active="set3" items="{{tabs}}"></x-import>
        <span style="font-size: 13px; color: #4e5948; padding-bottom: 12px">Latest 8 of 12 · select a sale for who entered it and its edit history</span>
      </div>
      <x-import component-from-global-scope="Kotila.LedgerTable" caption="Sales from Set 3, newest first" dense="{{yes}}" columns="{{columns}}" rows="{{rows}}"></x-import>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>

        { date: 'Mon 14 Sep', buyer: { value: 'Manure and droppings', sub: 'Other sale · 53 bags' }, set: 'Set 3', birds: none, per: none, total: '₦15,900', paid: '₦15,900', bal: none, method: 'Cash' },
        { date: 'Sun 13 Sep', buyer: 'Iya Bisi', set: 'Set 3', birds: '42', per: '₦7,550', total: '₦317,100', paid: '₦317,100', bal: none, method: 'Cash' },

        { date: 'Thu 10 Sep', buyer: 'Alhaji Sule', set: 'Set 3', birds: '50', per: { value: '₦7,171', sub: 'under bulk rate' }, total: '₦358,550', paid: '₦304,950', bal: { value: '₦53,600', tone: 'owed' }, method: 'Bank transfer' },

</script>
</body>
</html>
