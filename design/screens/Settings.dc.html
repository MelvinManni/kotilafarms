<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — owner, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kotila/components/bundle.css">
<script src="ds/kotila/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2ea;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#10180b}
a{color:#2f6410}a:hover{color:#1f470a}
</style>
</helmet>
<div class="k-root" style="position: relative; width: 1440px; height: 1000px; display: flex; background: #eef2ea; overflow: hidden">
  <x-import component-from-global-scope="Kotila.SideRail" active="settings" logo-src="/_blob/5f856855f9b37e32751e00e7d2b65ce0" user="{{user}}" sync="{{sync}}" badges="{{badges}}" style="height: 1000px"></x-import>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; color: #4e5948">6 active people · only owners see this page</span>
        <h1 style="margin: 0; font-family: Signika, sans-serif; font-weight: 600; font-size: 38px; line-height: 42px; letter-spacing: -0.02em">Settings</h1>
      </div>
      <div style="display: flex; gap: 12px">
        <x-import component-from-global-scope="Kotila.Button" variant="primary" icon="plus">Invite someone</x-import>
      </div>
    </header>

    <x-import component-from-global-scope="Kotila.Tabs" active="users" items="{{tabs}}"></x-import>

    <div style="display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start">
      <x-import component-from-global-scope="Kotila.Panel" flush="{{yes}}" title="People" subtitle="Everyone who can sign in. Deactivated people keep their name on what they entered." action="{{inviteAct}}">
        <x-import component-from-global-scope="Kotila.LedgerTable" caption="People with access" columns="{{peopleCols}}" rows="{{people}}"></x-import>
      </x-import>

      <x-import component-from-global-scope="Kotila.Panel" flush="{{yes}}" title="What each role can do" subtitle="Hidden, not greyed out: people only see what their role allows.">
        <x-import component-from-global-scope="Kotila.LedgerTable" caption="Access by role" dense="{{yes}}" columns="{{roleCols}}" rows="{{roles}}"></x-import>
      </x-import>
    </div>
  </main>
</div>
</x-dc>

        { person: { value: 'Adaeze Nwankwo', sub: 'adaeze@kotilafarms.ng' }, role: { tag: { tone: 'success', label: 'Manager' } }, last: { value: 'Today, 7:15am', sub: 'phone' }, status: active },

</body>
</html>
