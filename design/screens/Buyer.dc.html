<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alhaji Sule — Kotila Farms</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kotila/components/bundle.css">
<script src="ds/kotila/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2ea;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#10180b}
a{color:#2f6410}a:hover{color:#1f470a}
</style>
</helmet>
<div class="k-root" style="position: relative; width: 1440px; height: 1000px; display: flex; background: #eef2ea; overflow: hidden">
  <x-import component-from-global-scope="Kotila.SideRail" active="sales" logo-src="/_blob/5f856855f9b37e32751e00e7d2b65ce0" user="{{user}}" sync="{{sync}}" badges="{{badges}}" style="height: 1000px"></x-import>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; color: #4e5948"><a href="#" style="text-decoration: none">Sales</a> › Buyers</span>
        <h1 style="margin: 0; font-family: Signika, sans-serif; font-weight: 600; font-size: 38px; line-height: 42px; letter-spacing: -0.02em">Alhaji Sule</h1>
        <span style="font-size: 15px; color: #4e5948">0803 555 0142 · buying since June 2026</span>
      </div>
      <div style="display: flex; gap: 12px">
        <x-import component-from-global-scope="Kotila.Button" icon="naira">Record a payment</x-import>
        <x-import component-from-global-scope="Kotila.Button" variant="primary" icon="plus">New sale to Alhaji Sule</x-import>
      </div>
    </header>

    <div class="k-grid-4" style="padding: 20px 24px; background: #ffffff; border: 1px solid #e1e8da; border-radius: 24px">
      <x-import component-from-global-scope="Kotila.Figure" label="Birds bought" value="110" sub="3 sales · Sets 2 and 3"></x-import>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <x-import component-from-global-scope="Kotila.Figure" label="Average per bird" value="₦7,210"></x-import>
        <div>
          <x-import component-from-global-scope="Kotila.Delta" direction="down" tone="bad" tooltip="Bulk rate this year: ₦7,500 a bird">₦290 under bulk rate</x-import>
        </div>
      </div>
      <x-import component-from-global-scope="Kotila.Figure" label="Total bought" value="₦793,100" sub="since 28 Jun"></x-import>
      <x-import component-from-global-scope="Kotila.Figure" label="Still owes" value="₦53,600" sub="from the 10 Sep sale · 16 days" tone="owed"></x-import>
    </div>

    <x-import component-from-global-scope="Kotila.Notice" tone="warning" title="Alhaji Sule pays about ₦290 a bird less than the bulk rate">On 110 birds that is ₦31,900 over the year. Agree a price before the next sale.</x-import>

    <x-import component-from-global-scope="Kotila.Panel" title="Every sale" flush="{{yes}}">
      <x-import component-from-global-scope="Kotila.LedgerTable" caption="Every sale to Alhaji Sule, newest first" dense="{{yes}}" columns="{{saleColumns}}" rows="{{saleRows}}" footer="{{saleFooter}}"></x-import>
    </x-import>

    <x-import component-from-global-scope="Kotila.Panel" title="Payments" flush="{{yes}}" action="{{historyAction}}">
      <x-import component-from-global-scope="Kotila.LedgerTable" caption="Payments from Alhaji Sule, newest first" dense="{{yes}}" columns="{{payColumns}}" rows="{{payRows}}"></x-import>
    </x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var none = { value: '—', tone: 'muted' };
    return {
      yes: true,
      user: { name: 'Kosi', role: 'owner' },
      sync: { state: 'synced', lastSynced: '2 min ago' },
      badges: { sales: { count: 3, title: '3 buyers owe money' } },
      historyAction: { label: 'Edit history' },
      saleColumns: [
        { key: 'date', label: 'Date' },
        { key: 'set', label: 'Set' },
        { key: 'birds', label: 'Birds', align: 'right' },
        { key: 'per', label: 'Per bird', align: 'right' },
        { key: 'total', label: 'Total', align: 'right' },
        { key: 'paid', label: 'Paid', align: 'right' },
        { key: 'bal', label: 'Balance', align: 'right' },
        { key: 'method', label: 'Method' }
      ],
      saleRows: [
        { date: 'Thu 10 Sep 2026', set: 'Set 3', birds: '50', per: '₦7,171', total: '₦358,550', paid: '₦304,950', bal: { value: '₦53,600', tone: 'owed' }, method: 'Bank transfer' },
        { date: 'Thu 3 Sep 2026', set: 'Set 3', birds: '30', per: '₦7,200', total: '₦216,000', paid: '₦216,000', bal: none, method: 'Cash' },
        { date: 'Sun 28 Jun 2026', set: 'Set 2', birds: '30', per: '₦7,285', total: '₦218,550', paid: '₦218,550', bal: none, method: 'Bank transfer' }
      ],
      saleFooter: { date: '3 sales', set: '', birds: '110', per: '₦7,210', total: '₦793,100', paid: '₦739,500', bal: { value: '₦53,600', tone: 'owed' }, method: '' },
      payColumns: [
        { key: 'date', label: 'Date' },
        { key: 'amount', label: 'Amount', align: 'right' },
        { key: 'method', label: 'Method' },
        { key: 'for', label: 'For the sale of' },
        { key: 'by', label: 'Recorded by' }
      ],
      payRows: [
        { date: 'Mon 21 Sep', amount: '₦54,950', method: 'Cash', for: '10 Sep · 50 birds', by: 'Adaeze Nwankwo · Manager' },
        { date: 'Thu 10 Sep', amount: '₦250,000', method: 'Bank transfer', for: '10 Sep · 50 birds', by: 'Kosi · Owner' },
        { date: 'Thu 3 Sep', amount: '₦216,000', method: 'Cash', for: '3 Sep · 30 birds', by: 'Adaeze Nwankwo · Manager' },
        { date: 'Sun 28 Jun', amount: '₦218,550', method: 'Bank transfer', for: '28 Jun · 30 birds', by: 'Kosi · Owner' }
      ]
    };
  }
}
</script>
</body>
</html>
