<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Health and vaccines — owner, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kotila/components/bundle.css">
<script src="ds/kotila/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2ea;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#10180b}
a{color:#2f6410}a:hover{color:#1f470a}
</style>
</helmet>
<div class="k-root" style="position: relative; width: 1440px; height: 1100px; display: flex; background: #eef2ea; overflow: hidden">
  <x-import component-from-global-scope="Kotila.SideRail" active="health" logo-src="/_blob/5f856855f9b37e32751e00e7d2b65ce0" user="{{user}}" sync="{{sync}}" badges="{{badges}}" style="height: 1100px"></x-import>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; color: #4e5948">2 running Sets</span>
        <h1 style="margin: 0; font-family: Signika, sans-serif; font-weight: 600; font-size: 38px; line-height: 42px; letter-spacing: -0.02em">Health and vaccines</h1>
      </div>
      <div style="display: flex; gap: 12px">
        <x-import component-from-global-scope="Kotila.Button" icon="edit">Edit vaccine schedule</x-import>
        <x-import component-from-global-scope="Kotila.Button" variant="primary" icon="syringe">Record a treatment</x-import>
      </div>
    </header>

    <x-import component-from-global-scope="Kotila.Notice" tone="warning" icon="syringe" title="Gumboro is due tomorrow for Set 5" action="{{markGiven}}">Day 7 · 600 doses · give in drinking water in the morning</x-import>

    <div class="k-grid-2" style="align-items: stretch">
      <x-import component-from-global-scope="Kotila.Panel" flush="{{yes}}" title="Vaccine schedule · Set 5" subtitle="Front pen · started 20 Sep · day 6">
        <x-import component-from-global-scope="Kotila.LedgerTable" caption="Set 5 vaccines" columns="{{vaxCols}}" rows="{{set5}}"></x-import>
      </x-import>
      <x-import component-from-global-scope="Kotila.Panel" flush="{{yes}}" title="Vaccine schedule · Set 4" subtitle="Back pen · started 2 Sep · day 24 · all four given">
        <x-import component-from-global-scope="Kotila.LedgerTable" caption="Set 4 vaccines" columns="{{vaxCols}}" rows="{{set4}}"></x-import>
      </x-import>
    </div>

    <x-import component-from-global-scope="Kotila.Panel" flush="{{yes}}" title="Drugs and supplements" subtitle="Sets 4 and 5 · ₦43,800 since 12 Sep" action="{{recordAct}}">
      <x-import component-from-global-scope="Kotila.LedgerTable" caption="Drugs and supplements given, newest first" dense="{{yes}}" columns="{{drugCols}}" rows="{{drugs}}"></x-import>
    </x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>

</body>
</html>
