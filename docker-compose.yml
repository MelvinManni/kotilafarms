# Kotila Farm — local stack. PostgreSQL 18 and Node 24 LTS (checked 2026-09-26; see AGENTS.md version policy).
services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kotila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kotila}
      POSTGRES_DB: ${POSTGRES_DB:-kotila}
    ports:
      # Host port; change DB_PORT (and DATABASE_URL) if 5432 is taken
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned folder under this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kotila} -d ${POSTGRES_DB:-kotila}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    command: ["pnpm", "db:migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kotila}:${POSTGRES_PASSWORD:-kotila}@db:5432/${POSTGRES_DB:-kotila}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

  app:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kotila}:${POSTGRES_PASSWORD:-kotila}@db:5432/${POSTGRES_DB:-kotila}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  pgdata:
