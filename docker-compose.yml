# Kotila Farm — containers. PostgreSQL 18 and Node 24 LTS (checked 2026-09-26; see AGENTS.md version policy).
#   Local Postgres only (dev):         docker compose up -d db
#   App against AWS RDS (production):  docker compose --profile app up -d --build        (DATABASE_URL in .env points at RDS)
#   App and Postgres, all local:       docker compose --profile app --profile localdb up --build
#                                      with CONTAINER_DATABASE_URL=postgres://kotila:<password>@db:5432/kotila in .env
services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kotila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kotila}
      POSTGRES_DB: ${POSTGRES_DB:-kotila}
    ports:
      # Host port; change DB_PORT (and DATABASE_URL) if 5432 is taken
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned folder under this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kotila} -d ${POSTGRES_DB:-kotila}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Never started with the app unless asked for: production uses AWS RDS
    profiles: ["localdb"]

  # Migrates and sets up the database on start, then serves (see docker-start.sh)
  app:
    image: kotila-farm:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside a container "localhost" is the container itself; CONTAINER_DATABASE_URL overrides for the all-local stack
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-${DATABASE_URL}}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    profiles: ["app"]

volumes:
  pgdata:
